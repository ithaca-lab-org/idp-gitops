# Single-instance Postgres for Keycloak. Replaced by a CloudNativePG cluster in a later phase.
# Password comes from the Secret identity/keycloak-db (bootstrap-secrets.sh, key "password").
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-db
  namespace: identity
  labels:
    app.kubernetes.io/name: keycloak-db
spec:
  serviceName: keycloak-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-db
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17.11
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - {name: POSTGRES_USER, value: keycloak}
            - {name: POSTGRES_DB, value: keycloak}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-db, key: password}}
          readinessProbe:
            exec: {command: [pg_isready, -U, keycloak, -d, keycloak]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: [pg_isready, -U, keycloak, -d, keycloak]}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-db
  namespace: identity
spec:
  selector:
    app.kubernetes.io/name: keycloak-db
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
