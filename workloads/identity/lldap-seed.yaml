# Dev fixture: groups, users and memberships created in lldap on every rebuild by lldap's own
# bootstrap script (/app/bootstrap.sh in the lldap image). Idempotent: it creates or updates what is
# listed here and never deletes users or groups you create by hand (DO_CLEANUP=false).
#
# The users' password is NOT in Git (the repo is public and the Keycloak login is on the internet):
# all of them read it from the Secret identity/lldap-seed-users, created by idp-infra
# scripts/bootstrap-secrets.sh from Secret Manager (see idp-infra docs/identity.md to set your own).
# Remove this file to stop seeding. It is a post-sync hook, so it runs when the identity app
# syncs, which includes every fresh cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lldap-seed-groups
  namespace: identity
data:
  cloudspend-bu.json: |
    {"name": "cloudspend-bu"}
  supplychain-bu.json: |
    {"name": "supplychain-bu"}
  marketing-northeast-bu.json: |
    {"name": "marketing-northeast-bu"}
---
