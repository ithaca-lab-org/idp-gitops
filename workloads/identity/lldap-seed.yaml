apiVersion: batch/v1
kind: Job
metadata:
  name: lldap-seed
  namespace: identity
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lldap-seed
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: lldap/lldap:2026-09-22-debian-rootless # keep in step with lldap.yaml
          command: [/app/bootstrap.sh]
          env:
            - {name: LLDAP_URL, value: "http://lldap.identity.svc.cluster.local:17170"}
            - {name: LLDAP_ADMIN_USERNAME, value: admin}
            - {name: LLDAP_ADMIN_PASSWORD_FILE, value: /run/secrets/lldap-admin/admin-password}
            - {name: USER_CONFIGS_DIR, value: /bootstrap/user-configs}
            - {name: GROUP_CONFIGS_DIR, value: /bootstrap/group-configs}
            - {name: DO_CLEANUP, value: "false"}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: groups, mountPath: /bootstrap/group-configs, readOnly: true}
            - {name: users, mountPath: /bootstrap/user-configs, readOnly: true}
            - {name: admin, mountPath: /run/secrets/lldap-admin, readOnly: true}
            - {name: seed-password, mountPath: /run/secrets/lldap-seed-users, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: groups
          configMap:
            name: lldap-seed-groups
        - name: users
          configMap:
            name: lldap-seed-users
        - name: admin
          secret:
            secretName: lldap
            defaultMode: 0440
            items:
              - {key: admin-password, path: admin-password}
        - name: seed-password
          secret:
            secretName: lldap-seed-users
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lldap-ui-from-seed-job
  namespace: identity
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lldap
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: lldap-seed
      ports:
        - {protocol: TCP, port: 17170}
