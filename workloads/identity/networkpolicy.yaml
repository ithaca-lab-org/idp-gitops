# Default-deny ingress in the identity namespace, then only the flows that are needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: identity
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-db-from-keycloak
  namespace: identity
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - {protocol: TCP, port: 5432}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lldap-ldap-from-keycloak
  namespace: identity
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lldap
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - {protocol: TCP, port: 3890}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-http-from-gateway-and-admin
  namespace: identity
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes: [Ingress]
  ingress:
    # Only the ingress gateway (public OIDC), the Tailscale proxies (admin) and this namespace
    # (the master-frontend-url Job) may reach Keycloak. Other pods must not bypass the gateway
    # allow-list or spoof X-Forwarded-* headers (proxy.mode xforwarded trusts them).
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [istio-ingress, tailscale, identity]
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lldap-ui-from-tailscale
  namespace: identity
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lldap
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - {protocol: TCP, port: 17170}
