# Only for its ca.crt: the PUBLIC certificate of the in-cluster CA that signs Vault's listener
# (workloads/vault/tls.yaml), read by VaultConnection idp-vault (caCertSecretRef). cert-manager
# writes the issuing CA into every Secret it issues; the leaf key and certificate in this Secret
# are unused and harmless: client-auth only (no "server auth" usage, no DNS or IP SANs), so no TLS
# client accepts it as a server certificate. ClusterIssuer vault-ca is allowed here by the
# ValidatingAdmissionPolicy vault-ca-scope. Applied in the same sync as the VSO CRDs is fine: the
# cert-manager CRDs exist since wave 1 and the ClusterIssuer since Vault's wave 7.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-ca-bundle
  namespace: vault-secrets-operator
spec:
  secretName: vault-ca-bundle
  commonName: vault-ca-bundle.vault-secrets-operator
  duration: 2160h
  usages: [digital signature, client auth]
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: vault-ca
    kind: ClusterIssuer
