# portal-api: Keycloak OIDC login for the IDP portal. Session key comes from the Secret
# idp-system/portal-session (idp-infra/scripts/bootstrap-secrets.sh). The image is built and
# pushed by ithaca-lab-org/idp-portal; bump the tag and digest below with a PR to deploy a new version (the digest wins; the tag is for humans).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portal-api
  namespace: idp-system
  annotations:
    # Workload Identity: publish-only on the order-events topic (idp-infra modules/order-events)
    iam.gke.io/gcp-service-account: portal-api@project-324502ff-9928-4b17-a89.iam.gserviceaccount.com
automountServiceAccountToken: true # the order and secrets APIs call the Kubernetes API (see portal-rbac.yaml)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-api
  namespace: idp-system
  labels:
    app.kubernetes.io/name: portal-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal-api
    spec:
      serviceAccountName: portal-api
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal-api
          image: us-central1-docker.pkg.dev/project-324502ff-9928-4b17-a89/idp/portal-api:4375e8a79430d40ed6594d69323bb716d56dc48b@sha256:c8d59354304902c5ae8627275a83917b4ac2d186266897cc5db87d24e45d2406
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: LISTEN_ADDR, value: ":8080"}
            - {name: OIDC_ISSUER, value: "https://auth.apps.ithaca-idp.com/realms/ithaca"}
            - {name: OIDC_CLIENT_ID, value: idp-portal}
            - {name: OIDC_REDIRECT_URL, value: "https://portal.apps.ithaca-idp.com/auth/callback"}
            - {name: OIDC_EXTRA_CA_FILE, value: /etc/idp/ca/staging-ca.pem}
            - name: SESSION_KEY
              valueFrom:
                secretKeyRef: {name: portal-session, key: session-key}
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef: {name: portal-mongo, key: app-password}
            - {name: MONGO_URI, value: "mongodb://portal:$(MONGO_PASSWORD)@portal-mongo.idp-system.svc:27017/idp?authSource=idp"}
            - {name: MONGO_DB, value: idp}
            - {name: PUBSUB_PROJECT, value: project-324502ff-9928-4b17-a89}
            - {name: PUBSUB_TOPIC, value: order-events}
            # Portal Secrets page (workloads/vault/README.md "Portal Secrets"): write-only Vault
            # role portal-secrets, logged in with the projected token below. Images built before
            # the Secrets page ignore these variables. "false": routes 404, no Vault client.
            # SWITCH: "true" = Secrets page on (enabled 2026-10-29). Values reach Vault over TLS,
            # verified against the in-cluster CA only (VAULT_CACERT; needs an image with
            # VAULT_CACERT support, idp-portal feat/vault-tls; idp-infra ADR 0008).
            - {name: SECRETS_ENABLED, value: "true"}
            - {name: WORKLOADS_ENABLED, value: "true"}
            # Portal Resources page: buckets and grants (idp-infra ADR 0010). SWITCH: "true" = on (2026-11-08,
            # after scripts/resource-proof.sh passed: grants, pod access, reader vs writer, revoke, role limit,
            # orphan/empty release). "false" = routes 404. Needs the idp-broker enabled
            # (workloads/idp-operator/idp-broker.yaml) and the org-policy guardrails (idp-infra docs/tenant-resources.md).
            - {name: RESOURCES_ENABLED, value: "true"}
            - {name: VAULT_ADDR, value: "https://vault.vault.svc.cluster.local:8200"}
            - {name: VAULT_CACERT, value: /etc/idp/vault-ca/ca.crt}
            - {name: VAULT_SECRETS_ROLE, value: portal-secrets}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: staging-ca, mountPath: /etc/idp/ca, readOnly: true}
            - {name: vault-token, mountPath: /var/run/secrets/vault, readOnly: true}
            - {name: vault-ca, mountPath: /etc/idp/vault-ca, readOnly: true}
      volumes:
        - name: staging-ca
          configMap:
            name: staging-ca
        # Only the PUBLIC ca.crt of Certificate vault-ca-bundle (vault-ca-bundle.yaml), not its key.
        - name: vault-ca
          secret:
            secretName: vault-ca-bundle
            items:
              - {key: ca.crt, path: ca.crt}
        # portal-api's own ServiceAccount token with audience "vault", for the Vault Kubernetes
        # auth role portal-secrets. The kubelet rotates it (re-read the file for each login);
        # Vault rejects the default token, whose audience is the API server.
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken: {path: token, audience: vault, expirationSeconds: 600}
---
apiVersion: v1
kind: Service
metadata:
  name: portal-api
  namespace: idp-system
spec:
  selector:
    app.kubernetes.io/name: portal-api
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portal
  namespace: idp-system
spec:
  parentRefs:
    - name: ingress
      namespace: istio-ingress
      sectionName: https
  hostnames:
    - portal.apps.ithaca-idp.com
  rules:
    - backendRefs:
        - name: portal-api
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: idp-system
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: portal-api-from-gateway
  namespace: idp-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: portal-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-ingress
      ports:
        - {protocol: TCP, port: 8080}
