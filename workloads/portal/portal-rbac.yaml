# The portal creates and reads TeamNamespace resources, nothing else: no update, no delete, no
# access to any other resource. The operator does the rest, and the admission policy confines it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: idp-portal-orders
rules:
  - apiGroups: ["idp.ithaca-idp.com"]
    resources: ["teamnamespaces"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: idp-portal-orders
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: idp-portal-orders
subjects:
  - kind: ServiceAccount
    name: portal-api
    namespace: idp-system
