# The portal creates and reads single TeamNamespace resources and gets, creates and deletes single
# ManagedSecret resources, nothing else: no list or watch (they would expose every owner's email and
# order id, or every tenant's secret names), no update or patch, no other resource. The operator
# does the rest, and the admission policy confines it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: idp-portal-orders
rules:
  - apiGroups: ["idp.ithaca-idp.com"]
    resources: ["teamnamespaces"]
    verbs: ["get", "create"]
  # Portal Secrets page: one ManagedSecret per secret the portal writes to Vault; the operator
  # turns it into a VaultStaticSecret. get/create/delete by name only: no list or watch (they would
  # expose every tenant's secret names), no update or patch.
  - apiGroups: ["idp.ithaca-idp.com"]
    resources: ["managedsecrets"]
    verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: idp-portal-orders
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: idp-portal-orders
subjects:
  - kind: ServiceAccount
    name: portal-api
    namespace: idp-system
