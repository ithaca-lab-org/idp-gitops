# The portal creates and reads single TeamNamespace resources and gets, creates and deletes single
# ManagedSecret resources, nothing else: no list or watch (they would expose every owner's email and
# order id, or every tenant's secret names), no update or patch, no other resource. The operator
# does the rest, and the admission policy confines it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: idp-portal-orders
rules:
  - apiGroups: ["idp.ithaca-idp.com"]
    resources: ["teamnamespaces"]
    verbs: ["get", "create"]
  # Portal Secrets page: one ManagedSecret per secret the portal writes to Vault; the operator
  # turns it into a VaultStaticSecret. get/create/delete by name only: no list or watch (they would
  # expose every tenant's secret names), no update or patch.
  - apiGroups: ["idp.ithaca-idp.com"]
    resources: ["managedsecrets"]
    verbs: ["get", "create", "delete"]
  # Portal Workloads page (Order #03): one WorkloadIdentity per workload. get/list/create only: no
  # update, patch, delete or watch. list is needed for the page (the API requires a namespace and
  # checks the caller's admin groups first; names are not secret). Create is confined by the
  # idp-portal-scope admission policy to managed namespaces, empty spec, no labels/annotations.
  - apiGroups: ["idp.ithaca-idp.com"]
    resources: ["workloadidentities"]
    verbs: ["get", "list", "create"]
  # Portal Resources page (ADR 0010): bucket claims and access grants. Claims: get/list/create only (no
  # delete: removing a claim can orphan data). Grants: get/list/create/delete (delete = revoke access).
  # No update, patch or watch. Create is confined by the idp-portal-scope admission policy to managed
  # namespaces with the fixed shapes; the flag RESOURCES_ENABLED is off by default.
  - apiGroups: ["idp.ithaca-idp.com"]
    resources: ["bucketclaims"]
    verbs: ["get", "list", "create"]
  - apiGroups: ["idp.ithaca-idp.com"]
    resources: ["resourcegrants"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: idp-portal-orders
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: idp-portal-orders
subjects:
  - kind: ServiceAccount
    name: portal-api
    namespace: idp-system
