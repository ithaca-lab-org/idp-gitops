# TLS for the Vault listener (idp-infra docs/adr/0008-vault-tls-in-cluster-ca.md). An in-cluster CA,
# never Let's Encrypt: Vault's names (vault.vault.svc...) are cluster-internal.
#   self-signed Issuer (cert-manager ns) -> root CA Certificate vault-ca (Secret cert-manager/vault-ca)
#   -> ClusterIssuer vault-ca -> Certificate vault/vault-server-tls (mounted by the chart, values.yaml)
# The clients get the CA's PUBLIC certificate as `ca.crt` of a throwaway Certificate from the same
# ClusterIssuer in their own namespace (vault-ca-bundle in vault-secrets-operator and idp-system):
# cert-manager writes the issuing CA into every Secret it issues, so no trust-manager is needed.
# A ClusterIssuer can be referenced from any namespace, and tenants are namespace `admin` (which
# cert-manager aggregates Certificate create into), so the ValidatingAdmissionPolicy below limits
# vault-ca to the three namespaces that need it. Without it a tenant could mint a certificate for
# vault.vault.svc that every Vault client trusts.
# Sync waves inside the vault app: Argo CD applies a wave only after the previous one is Healthy
# (cert-manager Certificates and Issuers have built-in health checks), so the StatefulSet (wave 0)
# is created only once vault-server-tls is Ready. If it never turns Ready, vault-0 never appears:
# `kubectl -n vault describe certificate vault-server-tls` and the cert-manager logs say why.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vault-ca-scope
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      # CertificateRequest is what gets signed (anyone may create one directly); Certificate and
      # the ingress/gateway shims are checked too, so a misuse fails early with a clear message.
      - apiGroups: ["cert-manager.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["certificates", "certificaterequests"]
  matchConditions:
    - name: uses-vault-ca
      expression: >-
        object.spec.issuerRef.name == 'vault-ca' &&
        object.spec.issuerRef.?kind.orValue('Issuer') == 'ClusterIssuer'
  validations:
    - expression: "request.namespace in ['vault', 'vault-secrets-operator', 'idp-system']"
      reason: Forbidden
      messageExpression: >-
        'ClusterIssuer vault-ca (the Vault listener CA) may only be used in namespaces vault,
        vault-secrets-operator and idp-system, not ' + request.namespace
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: vault-ca-scope
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  policyName: vault-ca-scope
  validationActions: ["Deny"]
---
# Namespaced, so only the cert-manager namespace can use it (a self-signed ClusterIssuer would let
# anyone mint self-signed certificates; harmless, but not needed).
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vault-ca-selfsigned
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  selfSigned: {}
---
# The root CA. A ClusterIssuer reads its CA Secret from cert-manager's cluster resource namespace
# (cert-manager), where tenants cannot read Secrets. Long-lived: every client reads ca.crt once at
# start, and the cluster (with this CA) is rebuilt by `make down`/`make up` long before it expires.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-ca
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  isCA: true
  commonName: ithaca vault CA
  secretName: vault-ca
  duration: 87600h # 10 years
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: vault-ca-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-ca
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  ca:
    secretName: vault-ca
---
# Vault's listener certificate. Short-lived on purpose: cert-manager renews it 3 days before the
# 7-day expiry, the kubelet updates the mounted Secret, and the tls-reload sidecar
# (platform/vault/values.yaml) sends Vault a SIGHUP, which reloads the listener certificate
# without a restart or re-seal. SANs: every Service the chart creates (vault, vault-active,
# vault-standby, vault-internal, vault-ui) in its short and long forms, the per-pod names behind
# the headless vault-internal (api_addr; wildcards so 3 replicas still match), and the loopback
# address the chart's in-pod VAULT_ADDR uses (https://127.0.0.1:8200).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-server-tls
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: vault-server-tls
  duration: 168h
  renewBefore: 72h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages: [digital signature, server auth]
  dnsNames:
    - vault
    - vault.vault
    - vault.vault.svc
    - vault.vault.svc.cluster.local
    - vault-active
    - vault-active.vault
    - vault-active.vault.svc
    - vault-active.vault.svc.cluster.local
    - vault-standby
    - vault-standby.vault
    - vault-standby.vault.svc
    - vault-standby.vault.svc.cluster.local
    - vault-internal
    - vault-internal.vault
    - vault-internal.vault.svc
    - vault-internal.vault.svc.cluster.local
    - vault-ui
    - vault-ui.vault
    - vault-ui.vault.svc
    - vault-ui.vault.svc.cluster.local
    - "*.vault-internal"
    - "*.vault-internal.vault"
    - "*.vault-internal.vault.svc"
    - "*.vault-internal.vault.svc.cluster.local"
    - localhost
  ipAddresses:
    - 127.0.0.1
    - "::1"
  issuerRef:
    name: vault-ca
    kind: ClusterIssuer
