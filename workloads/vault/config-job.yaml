# vault-config: one-shot configuration of a freshly initialized Vault (PostSync hook of the vault app).
# Flow and failure handling: workloads/vault/README.md. Summary:
#   1. wait (max 20 min) until Vault is initialized and unsealed (`vault status` exit 0);
#   2. wait (max 20 min) for the bootstrap token in Secret vault/vault-bootstrap, key `token`. The
#      idp-infra bootstrap script creates it right after `vault operator init`: an orphan token
#      (30 min TTL, not renewable, no default policy, policy vault-bootstrap). The Secret is
#      mounted as an OPTIONAL volume, so the pod starts without it and the kubelet fills it in when it appears;
#   3. with that token: audit to stdout, kv-v2 at kv/, the demo secret, policy vso-demo,
#      Kubernetes auth with role vso-demo, the per-namespace policies ns-reader (templated on the
#      caller's ServiceAccount namespace) and ns-purge with roles ns-reader and idp-operator-purge,
#      the write-only policy and role portal-secrets (portal Secrets page), the policy and role
#      vault-proof (idp-infra scripts/vault-proof.sh; ServiceAccount vault/vault-proof);
#      marks completion by making the kubernetes/ auth mount
#      visible on the (unauthenticated) UI login page; then revokes its own token;
#   4. a second container deletes Secret vault/vault-bootstrap (RBAC: that one Secret only).
# Every call stays inside policy vault-bootstrap (sys/audit/*, sys/mounts[/*], sys/auth[/*],
# sys/policies/acl/*, auth/kubernetes/*, kv/*, auth/token/revoke-self). It deliberately avoids
# `vault audit list` (GET sys/audit needs sudo) and `vault token lookup` (lookup-self needs the
# default policy) and the kv CLI's mount preflight.
# Idempotent: when the token is gone or dead and the completion mark is present it exits 0. If the
# mark is missing it never exits 0, so the Secret is never deleted before Vault is configured.
# Steps added later only reach a Vault that is configured from scratch (every `make up`); an
# already configured Vault is left as it is (README "Re-runs and failures").
# The token is never printed (no set -x, CLI output goes to /dev/null).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-config
  namespace: vault
automountServiceAccountToken: false # only the cleanup container gets a (projected) token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-bootstrap-cleanup
  namespace: vault
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [vault-bootstrap]
    verbs: [get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-bootstrap-cleanup
  namespace: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-bootstrap-cleanup
subjects:
  - kind: ServiceAccount
    name: vault-config
    namespace: vault
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-config
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2 # a dead token does not heal by retrying; the error text says what to do
  activeDeadlineSeconds: 3000 # backstop; the script's own waits are 20 + 20 min
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-config # allowed to reach Vault by networkpolicy.yaml
    spec:
      serviceAccountName: vault-config
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: configure
          # Same image as the server (platform/vault/values.yaml): it ships the vault CLI and /bin/sh.
          image: hashicorp/vault:2.0.4@sha256:5be49781ecf78bfe775c5309c6a4d9f4e9e040b6c885c99eb2b12fb69855e1a2
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              TOKEN_FILE=/run/secrets/vault-bootstrap/token
              unset VAULT_TOKEN || true
              HELP="Re-run idp-infra ./scripts/bootstrap-secrets.sh (it issues a new 30 min bootstrap token
                into vault/vault-bootstrap), then sync the vault app in Argo CD. If Vault is initialized but
                the script cannot issue a token, rebuild Vault (idp-infra docs/vault.md, 'Rebuild Vault'):
                Vault 2.0 needs a valid token for 'vault operator generate-root', so the recovery keys
                alone do not give an admin token (workloads/vault/README.md in idp-gitops)."

              # Completion mark, readable without a token: the last config step makes the
              # kubernetes/ auth mount visible to unauthenticated clients (the UI login page).
              configured() {
                vault read -format=json sys/internal/ui/mounts 2>/dev/null | grep -q '"kubernetes/"'
              }
              # Enable something at a path; "already in use" means a previous run did it.
              enable() {
                if ! out="$("$@" 2>&1)"; then
                  case "$out" in
                    *"already in use"*) echo "  already enabled" ;;
                    *) printf '%s\n' "$out" >&2; return 1 ;;
                  esac
                fi
              }

              echo "waiting for Vault to be initialized and unsealed (max 20 min)"
              i=0
              until vault status >/dev/null 2>&1; do
                i=$((i + 1))
                if [ "$i" -gt 120 ]; then
                  echo "Vault is still sealed or uninitialized after 20 min. $HELP" >&2
                  exit 1
                fi
                sleep 10
              done
              echo "Vault is initialized and unsealed"

              i=0
              while [ ! -s "$TOKEN_FILE" ]; do
                if configured; then
                  echo "Vault is already configured and there is no bootstrap token: nothing to do"
                  exit 0
                fi
                i=$((i + 1))
                if [ "$i" -gt 80 ]; then
                  echo "no Secret vault/vault-bootstrap (key token) after 20 min. $HELP" >&2
                  exit 1
                fi
                echo "waiting for Secret vault/vault-bootstrap"
                sleep 15
              done

              VAULT_TOKEN="$(cat "$TOKEN_FILE")"
              export VAULT_TOKEN
              # Validity check inside the policy (read sys/mounts); fails when expired or revoked.
              if ! vault secrets list >/dev/null 2>&1; then
                unset VAULT_TOKEN
                if configured; then
                  echo "bootstrap token already used and Vault configured; removing the leftover Secret"
                  exit 0
                fi
                echo "the bootstrap token in vault/vault-bootstrap is expired or revoked (it lives 30 min) and Vault is not configured. $HELP" >&2
                exit 1
              fi

              echo "audit device: file to stdout"
              enable vault audit enable file file_path=stdout

              echo "secrets engine: kv-v2 at kv/"
              enable vault secrets enable -path=kv -version=2 kv

              # Plain write to the kv-v2 data path (no kv CLI preflight). A new kv-v2 mount needs a
              # moment before it accepts writes, so retry briefly.
              echo "demo secret: kv/vault-demo/hello"
              i=0
              until printf '%s' '{"data":{"message":"hello from vault"}}' \
                  | vault write kv/data/vault-demo/hello - >/dev/null 2>&1; do
                i=$((i + 1))
                if [ "$i" -gt 20 ]; then echo "could not write kv/data/vault-demo/hello" >&2; exit 1; fi
                sleep 3
              done

              echo "policy: vso-demo (read kv/data/vault-demo/hello only)"
              printf '%s\n' 'path "kv/data/vault-demo/hello" {' '  capabilities = ["read"]' '}' > /tmp/vso-demo.hcl
              vault policy write vso-demo /tmp/vso-demo.hcl >/dev/null

              echo "auth method: kubernetes"
              enable vault auth enable kubernetes
              # Vault runs in the cluster: it uses its own ServiceAccount token (vault/vault, bound to
              # system:auth-delegator by the chart) for TokenReview, and the in-pod CA.
              vault write auth/kubernetes/config kubernetes_host=https://kubernetes.default.svc >/dev/null
              vault write auth/kubernetes/role/vso-demo \
                bound_service_account_names=vault-demo \
                bound_service_account_namespaces=vault-demo \
                audience=vault \
                token_policies=vso-demo \
                token_ttl=10m \
                token_max_ttl=1h >/dev/null

              # Per-namespace access (README "Per-namespace access"). The policy path is templated on
              # the alias metadata of THIS mount, addressed by its accessor (auth_kubernetes_<hex>).
              # `vault auth list` is GET sys/auth (read, allowed); exactly one kubernetes mount exists.
              echo "per-namespace policies and roles: ns-reader, ns-purge, idp-operator-purge"
              ACC="$(vault auth list -format=json | grep -o '"auth_kubernetes_[0-9a-f]*"' | tr -d '"' | sort -u)"
              case "$ACC" in
                auth_kubernetes_?*) ;;
                *) echo "could not determine the kubernetes/ auth mount accessor" >&2; exit 1 ;;
              esac
              if [ "$(printf '%s\n' "$ACC" | wc -l)" -ne 1 ]; then
                echo "more than one kubernetes auth mount accessor found" >&2; exit 1
              fi
              NS="{{identity.entity.aliases.${ACC}.metadata.service_account_namespace}}"
              # A caller reads only kv/<its own namespace>/*. If the template cannot be resolved
              # (no entity, alias or key, or the value contains * or +), Vault drops that path rule,
              # so it grants nothing. The deny rules cover a resolved-but-empty value. The token
              # self-paths replace the default policy (the role sets token_no_default_policy): VSO
              # renews (renew-self), checks (lookup-self) and revokes (revoke-self) its token.
              printf '%s\n' \
                "path \"kv/data/${NS}/*\" {" '  capabilities = ["read"]' '}' \
                "path \"kv/metadata/${NS}/*\" {" '  capabilities = ["read", "list"]' '}' \
                'path "kv/data//*" {' '  capabilities = ["deny"]' '}' \
                'path "kv/metadata//*" {' '  capabilities = ["deny"]' '}' \
                'path "auth/token/lookup-self" {' '  capabilities = ["read"]' '}' \
                'path "auth/token/renew-self" {' '  capabilities = ["update"]' '}' \
                'path "auth/token/revoke-self" {' '  capabilities = ["update"]' '}' \
                > /tmp/ns-reader.hcl
              vault policy write ns-reader /tmp/ns-reader.hcl >/dev/null
              # KV v2: DELETE kv/metadata/<key> removes the key and all its versions; LIST walks a
              # namespace's tree. No read of secret data, no kv/data, no kv/destroy.
              # Denies: no LIST of the root (tenant names cannot be enumerated) and nothing under
              # platform namespaces (the reserved names/prefixes of idp-portal orders.go plus vault*).
              # Vault uses the most specific matching rule; these are more specific than
              # kv/metadata/*. A `*` is only a glob at the end of a path, so prefixes end in `*`.
              DENY='  capabilities = ["deny"]'
              printf '%s\n' \
                'path "kv/metadata/*" {' '  capabilities = ["list", "delete"]' '}' \
                'path "kv/metadata/" {' "$DENY" '}' \
                'path "kv/metadata/vault*" {' "$DENY" '}' \
                'path "kv/metadata/idp-system/*" {' "$DENY" '}' \
                'path "kv/metadata/argocd/*" {' "$DENY" '}' \
                'path "kv/metadata/identity/*" {' "$DENY" '}' \
                'path "kv/metadata/cert-manager/*" {' "$DENY" '}' \
                'path "kv/metadata/tailscale/*" {' "$DENY" '}' \
                'path "kv/metadata/default/*" {' "$DENY" '}' \
                'path "kv/metadata/echo/*" {' "$DENY" '}' \
                'path "kv/metadata/istio-*" {' "$DENY" '}' \
                'path "kv/metadata/kube-*" {' "$DENY" '}' \
                'path "kv/metadata/gke-*" {' "$DENY" '}' \
                'path "auth/token/lookup-self" {' '  capabilities = ["read"]' '}' \
                'path "auth/token/renew-self" {' '  capabilities = ["update"]' '}' \
                'path "auth/token/revoke-self" {' '  capabilities = ["update"]' '}' \
                > /tmp/ns-purge.hcl
              vault policy write ns-purge /tmp/ns-purge.hcl >/dev/null
              # Any namespace, one ServiceAccount name: the namespace is enforced by the policy
              # template, not by the role. '*' is quoted so the shell never globs it.
              vault write auth/kubernetes/role/ns-reader \
                bound_service_account_names=vault-reader \
                'bound_service_account_namespaces=*' \
                alias_name_source=serviceaccount_uid \
                audience=vault \
                token_policies=ns-reader \
                token_no_default_policy=true \
                token_ttl=10m \
                token_max_ttl=1h >/dev/null
              vault write auth/kubernetes/role/idp-operator-purge \
                bound_service_account_names=idp-operator \
                bound_service_account_namespaces=idp-system \
                audience=vault \
                token_policies=ns-purge \
                token_no_default_policy=true \
                token_ttl=5m \
                token_max_ttl=15m >/dev/null

              # Portal Secrets page (README "Portal Secrets"): portal-api writes and deletes tenant
              # secrets but is WRITE-ONLY: the portal must never be able to read a secret value, so
              # there is no `read` on kv/data and no kv/subkeys (it would reveal the key names).
              # A KV v2 write (PUT kv/data/<ns>/<name>) is `create` for a new key and `update` for an
              # existing one; its response carries only version metadata. DELETE kv/metadata/<ns>/<name>
              # (only the `delete` capability) removes a key with all its versions. No read or list on
              # kv/metadata either: a stolen token cannot enumerate tenants' secret names.
              # Denies: the same root LIST and platform prefixes as ns-purge, on kv/data and
              # kv/metadata; Vault uses the longest matching prefix, so `kv/data/vault*` beats
              # `kv/data/*` for kv/data/vault-demo/hello. kv/delete, destroy, undelete and subkeys are
              # not granted anyway; the explicit denies document that. The root LIST deny is moot
              # while nothing grants list; it stays as a guard if list is ever added.
              echo "policy and role: portal-secrets"
              {
                printf '%s\n' \
                  'path "kv/data/*" {' '  capabilities = ["create", "update"]' '}' \
                  'path "kv/metadata/*" {' '  capabilities = ["delete"]' '}' \
                  'path "kv/metadata/" {' "$DENY" '}'
                for p in 'vault*' 'idp-system/*' 'argocd/*' 'identity/*' 'cert-manager/*' \
                    'tailscale/*' 'default/*' 'echo/*' 'istio-*' 'kube-*' 'gke-*'; do
                  printf '%s\n' "path \"kv/data/${p}\" {" "$DENY" '}' \
                    "path \"kv/metadata/${p}\" {" "$DENY" '}'
                done
                printf '%s\n' \
                  'path "kv/delete/*" {' "$DENY" '}' \
                  'path "kv/destroy/*" {' "$DENY" '}' \
                  'path "kv/undelete/*" {' "$DENY" '}' \
                  'path "kv/subkeys/*" {' "$DENY" '}' \
                  'path "auth/token/lookup-self" {' '  capabilities = ["read"]' '}' \
                  'path "auth/token/renew-self" {' '  capabilities = ["update"]' '}' \
                  'path "auth/token/revoke-self" {' '  capabilities = ["update"]' '}'
              } > /tmp/portal-secrets.hcl
              vault policy write portal-secrets /tmp/portal-secrets.hcl >/dev/null
              vault write auth/kubernetes/role/portal-secrets \
                bound_service_account_names=portal-api \
                bound_service_account_namespaces=idp-system \
                audience=vault \
                token_policies=portal-secrets \
                token_no_default_policy=true \
                token_ttl=10m \
                token_max_ttl=1h >/dev/null

              # Proof role (README "Proof role vault-proof"): idp-infra scripts/vault-proof.sh logs in
              # as ServiceAccount vault/vault-proof (no workload uses it, no RBAC). It may only touch
              # the two throwaway proof namespaces' KV paths and read role portal-secrets (P7
              # existence check). No sudo, no sys/*. In ACL paths `*` is a glob only at the END, so
              # the two namespaces are listed one by one. KV v2: PUT kv/data/<ns>/<key> is create or
              # update, GET is read; LIST kv/metadata/<ns>/ is list; DELETE kv/metadata/<ns>/<key>
              # removes a key with all versions. Self paths replace the default policy.
              echo "policy and role: vault-proof"
              printf '%s\n' \
                'path "kv/data/vproof-a/*" {' '  capabilities = ["create", "update", "read"]' '}' \
                'path "kv/data/vproof-b/*" {' '  capabilities = ["create", "update", "read"]' '}' \
                'path "kv/metadata/vproof-a/*" {' '  capabilities = ["list", "delete"]' '}' \
                'path "kv/metadata/vproof-b/*" {' '  capabilities = ["list", "delete"]' '}' \
                'path "auth/kubernetes/role/portal-secrets" {' '  capabilities = ["read"]' '}' \
                'path "auth/token/lookup-self" {' '  capabilities = ["read"]' '}' \
                'path "auth/token/revoke-self" {' '  capabilities = ["update"]' '}' \
                > /tmp/vault-proof.hcl
              vault policy write vault-proof /tmp/vault-proof.hcl >/dev/null
              # Bound to vault/vault-proof only; 1 h, not renewable past 1 h (and no renew-self).
              vault write auth/kubernetes/role/vault-proof \
                bound_service_account_names=vault-proof \
                bound_service_account_namespaces=vault \
                audience=vault \
                token_policies=vault-proof \
                token_no_default_policy=true \
                token_ttl=1h \
                token_max_ttl=1h >/dev/null

              # Completion mark (see configured() above). Must stay the last config step.
              vault write sys/auth/kubernetes/tune listing_visibility=unauth >/dev/null

              echo "revoking the bootstrap token"
              vault token revoke -self >/dev/null
              unset VAULT_TOKEN
              echo "Vault configured"
          env:
            - {name: VAULT_ADDR, value: "http://vault.vault.svc.cluster.local:8200"}
            - {name: HOME, value: /tmp} # no token helper file in a read-only home
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: bootstrap, mountPath: /run/secrets/vault-bootstrap, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: cleanup
          image: registry.k8s.io/kubectl:v1.36.6@sha256:0650805141538d13ccbb6bb9e0dd647bc415bc002898357970211c4d47224396
          command: [kubectl]
          args: [delete, secret, vault-bootstrap, --namespace=vault, --ignore-not-found, --wait=false]
          env:
            - {name: HOME, value: /tmp}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: kube-api, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: bootstrap
          secret:
            secretName: vault-bootstrap
            optional: true
            defaultMode: 0440
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 8Mi}
        # The ServiceAccount token, CA and namespace for in-cluster kubectl, mounted into the
        # cleanup container only (the configure container never sees a Kubernetes credential).
        - name: kube-api
          projected:
            defaultMode: 0440 # group fsGroup 1000, which every container in the pod has
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 600}
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - {key: ca.crt, path: ca.crt}
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef: {fieldPath: metadata.namespace}
