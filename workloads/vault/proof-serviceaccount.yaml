# vault-proof: the identity of idp-infra scripts/vault-proof.sh (README "Proof role vault-proof").
# No workload runs as it and it has no Kubernetes RBAC. The Vault Kubernetes auth role vault-proof
# (config-job.yaml) accepts only this ServiceAccount in this namespace and grants only
# kv/vproof-a/* and kv/vproof-b/* plus a read of role portal-secrets. A platform admin gets a
# short-lived token for it with `kubectl -n vault create token vault-proof --audience vault`.
# Whoever can create tokens in namespace vault can use the role: cluster admins, Argo CD (anyone
# who can merge to idp-gitops) and GCP principals with roles/container.developer or
# roles/container.admin. Tenants cannot: `vault` and `vault-*` are reserved TeamNamespace names.
# The Vault token is bound to 127.0.0.1 (usable only from inside vault-0).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-proof
  namespace: vault
automountServiceAccountToken: false
