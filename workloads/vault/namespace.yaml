# Not in the ambient mesh (no istio.io/dataplane-mode label): Vault, its config Job and VSO talk
# plain HTTP inside the cluster, fenced by networkpolicy.yaml. If this namespace ever joins the
# mesh, the NetworkPolicies must also allow ztunnel's HBONE port 15008.
apiVersion: v1
kind: Namespace
metadata:
  name: vault
  labels:
    pod-security.kubernetes.io/enforce: restricted
