# Not in the ambient mesh (no istio.io/dataplane-mode label): Vault's own TLS listener (tls.yaml)
# protects the traffic, fenced by networkpolicy.yaml. If this namespace ever joins the mesh, the
# NetworkPolicies must also allow ztunnel's HBONE port 15008.
# Sync wave -4: the Certificate vault-server-tls (wave -1) is created before the chart (wave 0).
apiVersion: v1
kind: Namespace
metadata:
  name: vault
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
  labels:
    pod-security.kubernetes.io/enforce: restricted
