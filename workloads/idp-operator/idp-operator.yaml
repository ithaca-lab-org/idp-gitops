# idp-operator: reconciles TeamNamespace resources (cluster-scoped CR) into namespaces.
# The CRD, ClusterRole/Role and the admission policy come from the idp-portal repo, pinned to the
# same commit as the image (see apps/idp-operator.yaml). The ServiceAccount name is part of the
# admission policy (idp-system/idp-operator): do not rename it, or the policy silently stops applying.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: idp-operator
  namespace: idp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: idp-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: idp-operator
subjects:
  - kind: ServiceAccount
    name: idp-operator
    namespace: idp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: idp-operator
  namespace: idp-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: idp-operator
subjects:
  - kind: ServiceAccount
    name: idp-operator
    namespace: idp-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idp-operator
  namespace: idp-system
  labels:
    app.kubernetes.io/name: idp-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: idp-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: idp-operator
    spec:
      serviceAccountName: idp-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: us-central1-docker.pkg.dev/project-324502ff-9928-4b17-a89/idp/idp-operator:e9afff1deb9c038553cdc4504b8d06d48d33c4db@sha256:96cbbc20ef7f743cadc0ae74d966b7134c772bc3886e5feafec0014a6ecc2fb7
          args:
            - --leader-elect=true
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8443
          env:
            # Per-namespace Vault access and KV purge (idp-portal #19). Everything else uses the
            # defaults: VAULT_ADDR http://vault.vault.svc.cluster.local:8200, purge role
            # idp-operator-purge, token file /var/run/secrets/vault/token.
            - {name: VAULT_ENABLED, value: "true"}
          ports:
            - {name: metrics, containerPort: 8443}
            - {name: probes, containerPort: 8081}
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi} # caches ServiceAccounts and VaultAuths cluster-wide since the Vault access
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: vault-token, mountPath: /var/run/secrets/vault, readOnly: true}
      volumes:
        # The operator's own ServiceAccount token with audience "vault", for the Vault Kubernetes
        # auth role idp-operator-purge (workloads/vault/README.md "Per-namespace access"). The
        # kubelet rotates it; Vault rejects the default token, whose audience is the API server.
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken: {path: token, audience: vault, expirationSeconds: 600}
