# idp-operator: reconciles TeamNamespace resources (cluster-scoped CR) into namespaces.
# The CRD, ClusterRole/Role and the admission policy come from the idp-portal repo, pinned to the
# same commit as the image (see apps/idp-operator.yaml). The ServiceAccount name is part of the
# admission policy (idp-system/idp-operator): do not rename it, or the policy silently stops applying.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: idp-operator
  namespace: idp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: idp-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: idp-operator
subjects:
  - kind: ServiceAccount
    name: idp-operator
    namespace: idp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: idp-operator
  namespace: idp-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: idp-operator
subjects:
  - kind: ServiceAccount
    name: idp-operator
    namespace: idp-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idp-operator
  namespace: idp-system
  labels:
    app.kubernetes.io/name: idp-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: idp-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: idp-operator
    spec:
      serviceAccountName: idp-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: us-central1-docker.pkg.dev/project-324502ff-9928-4b17-a89/idp/idp-operator:4375e8a79430d40ed6594d69323bb716d56dc48b@sha256:95a9653446b88667b900a6320bb3dd30fe530333250ca2b1862aa15a586113f6
          args:
            - --leader-elect=true
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8443
          env:
            # Per-namespace Vault access and KV purge (idp-portal #19). Everything else uses the
            # defaults: purge role idp-operator-purge, token file /var/run/secrets/vault/token.
            - {name: VAULT_ENABLED, value: "true"}
            # Vault's TLS listener, verified against the in-cluster CA only (needs an image with
            # VAULT_CACERT support, idp-portal feat/vault-tls; idp-infra ADR 0008). The CA comes
            # from Secret vault-ca-bundle (workloads/portal/vault-ca-bundle.yaml, wave 11 < 12).
            - {name: VAULT_ADDR, value: "https://vault.vault.svc.cluster.local:8200"}
            - {name: VAULT_CACERT, value: /etc/idp/vault-ca/ca.crt}
            # Tenant hostnames in the platform certificate (idp-infra ADR 0009 option 2b): the operator
            # keeps spec.dnsNames of istio-ingress/wildcard-apps in step with the TeamNamespaces. Needs
            # workloads/ingress/tenant-cert-rbac.yaml and the idp-operator-scope policy of this commit.
            - {name: TENANT_CERT_ENABLED, value: "true"}
          ports:
            - {name: metrics, containerPort: 8443}
            - {name: probes, containerPort: 8081}
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi} # caches ServiceAccounts and VaultAuths cluster-wide since the Vault access
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: vault-token, mountPath: /var/run/secrets/vault, readOnly: true}
            - {name: vault-ca, mountPath: /etc/idp/vault-ca, readOnly: true}
      volumes:
        # Only the PUBLIC ca.crt of Certificate idp-system/vault-ca-bundle, not its key.
        - name: vault-ca
          secret:
            secretName: vault-ca-bundle
            items:
              - {key: ca.crt, path: ca.crt}
        # The operator's own ServiceAccount token with audience "vault", for the Vault Kubernetes
        # auth role idp-operator-purge (workloads/vault/README.md "Per-namespace access"). The
        # kubelet rotates it; Vault rejects the default token, whose audience is the API server.
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken: {path: token, audience: vault, expirationSeconds: 600}
