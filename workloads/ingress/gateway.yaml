# Istio ingress gateway through the Gateway API. Istio renders the Service from the
# `istio` GatewayClass; with spec.addresses set it sets loadBalancerIP to the first
# address (verified in Istio 1.27.1 kube-gateway.yaml template). 34.45.29.28 is the
# regional static IP reserved by idp-infra (envs/persistent, module ingress) and the
# target of *.apps.ithaca-idp.com.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ingress
  namespace: istio-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  gatewayClassName: istio
  addresses:
    - type: IPAddress
      value: 34.45.29.28
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: "*.apps.ithaca-idp.com"
      allowedRoutes:
        namespaces:
          from: Same # only the redirect route below
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*.apps.ithaca-idp.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-apps-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              ithaca.idp/gateway-access: "allowed"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: istio-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  parentRefs:
    - name: ingress
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
