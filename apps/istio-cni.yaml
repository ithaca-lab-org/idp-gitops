# Wave 5: Istio CNI node agent (redirects pod traffic to ztunnel).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-cni
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  sources:
    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart: cni
      targetRevision: 1.27.1
      helm:
        releaseName: istio-cni
        valueFiles:
          - $values/platform/istio/cni.yaml
    - repoURL: https://github.com/ithaca-lab-org/idp-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
