# Wave 8: Vault Secrets Operator (official hashicorp chart), after Vault (7). It does not need Vault
# to be up to start: it only talks to Vault when a VaultStaticSecret asks, and retries on its own.
# CRDs come from the chart's crds/ directory with ServerSideApply, like cert-manager and Tailscale.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-secrets-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: default
  sources:
    - repoURL: https://helm.releases.hashicorp.com
      chart: vault-secrets-operator
      targetRevision: 1.6.2
      helm:
        releaseName: vault-secrets-operator
        valueFiles:
          - $values/platform/vault-secrets-operator/values.yaml
    - repoURL: https://github.com/ithaca-lab-org/idp-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: vault-secrets-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # the VSO CRDs are large
