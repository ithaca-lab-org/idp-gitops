# Wave 9: Keycloak (official image via the codecentric keycloakx chart), realm "ithaca"
# imported from workloads/keycloak/realm.yaml, federated to lldap, with the idp-portal OIDC client.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  project: default
  sources:
    - repoURL: https://codecentric.github.io/helm-charts
      chart: keycloakx
      targetRevision: 7.4.0
      helm:
        releaseName: keycloak
        valueFiles:
          - $values/platform/keycloak/values.yaml
    - repoURL: https://github.com/ithaca-lab-org/idp-gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/ithaca-lab-org/idp-gitops.git
      targetRevision: main
      path: workloads/keycloak
  destination:
    server: https://kubernetes.default.svc
    namespace: identity
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
