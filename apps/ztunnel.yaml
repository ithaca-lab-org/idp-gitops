# Wave 5: ztunnel, the per-node ambient proxy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ztunnel
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  sources:
    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart: ztunnel
      targetRevision: 1.27.1
      helm:
        releaseName: ztunnel
        valueFiles:
          - $values/platform/istio/ztunnel.yaml
    - repoURL: https://github.com/ithaca-lab-org/idp-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
  # The chart's ZTUNNEL_CPU_LIMIT env var uses resourceFieldRef without a divisor; the API
  # server defaults it to "0" after creation, which Argo CD reports as OutOfSync forever.
  ignoreDifferences:
    - group: apps
      kind: DaemonSet
      jqPathExpressions:
        - .spec.template.spec.containers[]?.env[]?.valueFrom.resourceFieldRef.divisor
