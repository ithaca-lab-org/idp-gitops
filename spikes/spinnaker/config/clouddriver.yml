# One Kubernetes account that sees ONLY namespace spike-app, using Clouddriver's own ServiceAccount.
# Keys follow the Halyard-era schema; if Clouddriver 2026.4.1 rejects them, the log says which key.
kubernetes:
  enabled: true
  accounts:
    - name: spike
      providerVersion: V2
      serviceAccount: true
      namespaces: [spike-app]
      kinds: [deployments, replicaSets, pods, services]
      cacheThreads: 1
