apiVersion: apps/v1
kind: Deployment
metadata:
  name: spike-web
spec:
  replicas: 1
  selector:
    matchLabels: {app: spike-web}
  template:
    metadata:
      labels: {app: spike-web}
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
