# Helm values for cert-manager (see apps/cert-manager.yaml for the pinned chart version).
crds:
  enabled: true
  keep: false # the cluster is rebuilt often; CRDs go with the release

# Do NOT aggregate the cert-manager ClusterRoles into the Kubernetes `admin`/`edit`/`view` roles (the chart default).
# Tenant namespace admins hold `admin`, so the default would let them create Certificates, CertificateRequests and
# Issuers: a Certificate that references our letsencrypt-* ClusterIssuer can request ANY name in the DNS zone through
# DNS-01 (a valid certificate for auth.apps... or portal.apps...), a tenant can exhaust the Let's Encrypt limits that
# the platform's own renewals need, and an Issuer with an http01 gatewayHTTPRoute solver can attract traffic for other
# tenants' hostnames. Platform components that need cert-manager objects have explicit RBAC (for example
# workloads/ingress/tenant-cert-rbac.yaml). Tenants get hostnames through the platform, never certificates.
global:
  rbac:
    aggregateClusterRoles: false

resources:
  requests:
    cpu: 25m
    memory: 64Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi

# Workload Identity: this Kubernetes service account acts as the Google service account
# that has dns.admin on the Cloud DNS zone (created in idp-infra, envs/persistent).
serviceAccount:
  annotations:
    iam.gke.io/gcp-service-account: cert-manager-dns01@project-324502ff-9928-4b17-a89.iam.gserviceaccount.com

# Check DNS-01 propagation against public resolvers only; the zone is public and this
# avoids waiting on in-cluster/NAT resolver behavior.
extraArgs:
  - --dns01-recursive-nameservers-only
  - --dns01-recursive-nameservers=8.8.8.8:53,1.1.1.1:53
